{% extends "dashboard/base.html" %}

{% block title %}
<title>Удаление портфеля</title>
{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <h1 class="h4">Удаление портфеля</h1>
            <p>
                Вы уверены, что хотите удалить портфель
                «{{ portfolio.name }}»? Все позиции и история операций
                будут удалены.
            </p>
            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Удалить</button>
                <a href="{% url 'dashboard:portfolio_detail' portfolio.pk %}"
                   class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
{% endblock %}
